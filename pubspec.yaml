name: aquaroute
description: "A Fleet Tracking, Telemetry, and Route Optimization System"
publish_to: 'none' # Prevents accidental publishing to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  url_launcher: ^6.3.0
  # State Management
  flutter_riverpod: ^3.3.2
  
  # Networking & Backend
  supabase_flutter: ^2.0.0
  http: ^1.1.0
  
  # Maps & Geolocation
  geolocator: ^14.0.2

  # Utilities
  flutter_dotenv: ^6.0.1 # For securing your Google/Supabase Keys
  intl: ^0.20.3          # For formatting dates/currencies
  geocoding: ^4.0.0
  file_picker: ^8.0.0    # Permit Vault document uploads
  qr_flutter: ^4.1.0     # Worker WASA QR clearance badge
  shared_preferences: ^2.3.0 # Persisting a guest's last order id for order tracking

  # Maps (OpenStreetMap) -- replaces google_maps_flutter across the app
  flutter_map: ^7.0.0
  latlong2: ^0.9.1

  # Website display typeface (Fraunces) -- web-only, mobile app screens
  # keep using the default Material font.
  google_fonts: ^6.2.1

  # Admin dashboard trend charts -- permit expiry runway, review throughput,
  # accreditation mix. Admin-portal only; no app or public-website screen
  # imports it.
  fl_chart: ^1.2.0

  # Real URLs for the public website only (/about, /stations/<id>, ...), so
  # pages are shareable, bookmarkable and indexable. The mobile app and the
  # admin portal keep imperative Navigator routing -- see lib/web_router.dart.
  go_router: ^17.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env


